<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <!-- Identidad de la App (Para el celular) -->
    <title>Boxfit Pro</title>
    <meta name="application-name" content="Boxfit Pro">
    <meta name="apple-mobile-web-app-title" content="Boxfit Pro">
    <meta name="theme-color" content="#18181b">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    
    <!-- Ícono Integrado de Guantes de Boxeo (SVG Data URI) -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%2318181b'/><text x='50' y='72' font-size='65' text-anchor='middle'>🥊</text></svg>">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%2318181b'/><text x='50' y='72' font-size='65' text-anchor='middle'>🥊</text></svg>">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Barlow Condensed', sans-serif;
            user-select: none;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        .font-bebas { font-family: 'Bebas Neue', sans-serif; }
        
        /* Animación del guante superior izquierdo */
        .glove-glow {
            filter: drop-shadow(0 0 8px rgba(220, 38, 38, 0.8));
            animation: pulseGlow 2s infinite;
        }
        @keyframes pulseGlow {
            0%, 100% { filter: drop-shadow(0 0 8px rgba(220, 38, 38, 0.6)); }
            50% { filter: drop-shadow(0 0 15px rgba(220, 38, 38, 1)); }
        }

        /* Flash de alerta a los 30s */
        .flash-warning {
            animation: flashScreen 0.6s ease-out;
        }
        @keyframes flashScreen {
            0% { background-color: #eab308; }
            100% { background-color: transparent; }
        }

        /* Anillo de progreso suave */
        circle {
            transition: stroke-dashoffset 0.1s linear;
        }
    </style>
</head>
<body class="bg-zinc-950 text-white h-screen w-screen overflow-hidden flex flex-col items-center justify-center relative">

    <!-- Audios en la nube de Google -->
    <audio id="bellSound" src="https://actions.google.com/sounds/v1/alarms/boxing_bell.ogg" preload="auto"></audio>
    <audio id="whistleSound" src="https://actions.google.com/sounds/v1/sports/referee_whistle.ogg" preload="auto"></audio>

    <!-- Logo Superior Izquierdo -->
    <div class="absolute top-4 left-4 z-[60] pointer-events-none flex items-center bg-zinc-900/80 rounded-full pr-4 p-1 shadow-lg border border-zinc-800">
        <div class="w-10 h-10 flex items-center justify-center glove-glow">
            <svg viewBox="0 0 24 24" fill="url(#grad)" class="w-8 h-8">
                <defs>
                    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:#ef4444;stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#991b1b;stop-opacity:1" />
                    </linearGradient>
                </defs>
                <path d="M18,6C16.8,6 15.6,6.3 14.6,7L14.3,7.2C13.5,7.7 12.5,8 11.5,8H10C8.3,8 7,9.3 7,11V16C7,17.7 8.3,19 10,19H12.5C13.3,19 14.1,18.8 14.8,18.3L15.3,18C16,17.5 16.8,17.2 17.6,17.1L18.4,17C20.4,16.7 22,15 22,13V10C22,7.8 20.2,6 18,6M7,12H5C3.9,12 3,12.9 3,14V17C3,18.1 3.9,19 5,19H7V12Z" />
            </svg>
        </div>
        <span class="font-bebas text-2xl tracking-wider ml-1 text-zinc-100">BOXFIT PRO</span>
    </div>

    <!-- Contenedor del Flash y Semáforo -->
    <div id="screenOverlay" class="absolute inset-0 z-0 transition-colors duration-300 pointer-events-none"></div>

    <!-- PANTALLA PRINCIPAL (Temporizador Clásico) -->
    <main id="mainView" class="z-10 flex flex-col items-center justify-center w-full h-full pb-20">
        <!-- Indicador de Estado -->
        <div id="statusText" class="text-4xl font-bold uppercase tracking-widest text-zinc-400 mb-2">Preparado</div>
        
        <!-- Timer y Anillo -->
        <div class="relative w-72 h-72 flex items-center justify-center mb-6">
            <svg class="absolute inset-0 w-full h-full transform -rotate-90">
                <circle cx="144" cy="144" r="135" stroke="#27272a" stroke-width="12" fill="none" />
                <circle id="progressRing" cx="144" cy="144" r="135" stroke="#ef4444" stroke-width="12" fill="none" stroke-linecap="round" 
                        stroke-dasharray="848" stroke-dashoffset="0" />
            </svg>
            <div id="timeDisplay" class="font-bebas text-9xl tracking-tight relative z-10 drop-shadow-md">00:00</div>
        </div>
        
        <!-- Rondas -->
        <div class="text-2xl text-zinc-400 font-semibold bg-zinc-900 px-6 py-2 rounded-full mb-8">
            ROUND <span id="currentRoundDisplay" class="text-white">1</span> / <span id="totalRoundsDisplay">3</span>
        </div>

        <!-- Controles Principales -->
        <div class="flex gap-4">
            <button id="btnStart" class="bg-red-600 hover:bg-red-500 text-white font-bebas text-4xl px-12 py-4 rounded-2xl shadow-[0_0_20px_rgba(220,38,38,0.4)] transition-all">INICIAR</button>
            <button id="btnReset" class="bg-zinc-800 hover:bg-zinc-700 text-white font-bebas text-4xl px-8 py-4 rounded-2xl transition-all">↻</button>
        </div>
    </main>

    <!-- MODO SEMÁFORO (Pantalla Completa) -->
    <div id="trafficLightView" class="hidden absolute inset-0 z-50 flex flex-col items-center justify-center cursor-pointer transition-colors duration-200">
        <div id="trafficStatus" class="font-bebas text-5xl opacity-80 mb-4">LISTO</div>
        <div id="trafficTime" class="font-bebas text-[15rem] leading-none tracking-tighter drop-shadow-lg">00:00</div>
        <div class="mt-8 text-3xl font-bold bg-black/30 px-8 py-3 rounded-full">
            ROUND <span id="trafficRound">1</span>/<span id="trafficTotal">3</span>
        </div>
    </div>

    <!-- NAVEGACIÓN INFERIOR (Glassmorphism) -->
    <nav class="absolute bottom-6 z-40 bg-zinc-900/80 backdrop-blur-md px-6 py-3 rounded-full flex gap-8 border border-zinc-800 shadow-2xl">
        <button id="navTimer" class="text-red-500 flex flex-col items-center p-2">
            <span class="text-2xl">⏱</span>
            <span class="text-xs font-bold mt-1">TIMER</span>
        </button>
        <button id="navTraffic" class="text-zinc-500 hover:text-white flex flex-col items-center p-2 transition-colors">
            <span class="text-2xl">🚦</span>
            <span class="text-xs font-bold mt-1">SEMÁFORO</span>
        </button>
        <button id="navRoulette" class="text-zinc-500 hover:text-white flex flex-col items-center p-2 transition-colors">
            <span class="text-2xl">🎡</span>
            <span class="text-xs font-bold mt-1">RULETAS</span>
        </button>
        <button id="navSettings" class="text-zinc-500 hover:text-white flex flex-col items-center p-2 transition-colors">
            <span class="text-2xl">⚙️</span>
            <span class="text-xs font-bold mt-1">AJUSTES</span>
        </button>
    </nav>

    <!-- MODAL AJUSTES -->
    <div id="settingsModal" class="hidden absolute inset-0 z-[70] bg-zinc-950/95 backdrop-blur-sm flex flex-col p-6 items-center pt-24">
        <h2 class="font-bebas text-5xl text-white mb-6">AJUSTES DE RUTINA</h2>
        
        <div class="w-full max-w-md bg-zinc-900 rounded-2xl p-6 border border-zinc-800 mb-6 shadow-xl">
            <h3 class="text-xl text-zinc-400 mb-4 font-bold">PERFILES RÁPIDOS</h3>
            <div class="grid grid-cols-2 gap-3 mb-6">
                <button class="preset-btn bg-zinc-800 hover:bg-red-600 text-white py-3 rounded-lg font-bold transition-colors" data-w="180" data-r="60" data-rd="3">AMATEUR (3x3)</button>
                <button class="preset-btn bg-zinc-800 hover:bg-red-600 text-white py-3 rounded-lg font-bold transition-colors" data-w="180" data-r="60" data-rd="12">PRO (12x3)</button>
                <button class="preset-btn bg-zinc-800 hover:bg-red-600 text-white py-3 rounded-lg font-bold transition-colors" data-w="300" data-r="60" data-rd="5">MMA (5x5)</button>
                <button class="preset-btn bg-zinc-800 hover:bg-red-600 text-white py-3 rounded-lg font-bold transition-colors" data-w="20" data-r="10" data-rd="8">TABATA (8x20s)</button>
            </div>

            <div class="space-y-4">
                <div class="flex justify-between items-center">
                    <label class="font-bold text-lg text-zinc-300">Tiempo de Round (min:seg)</label>
                    <input type="text" id="inpWork" value="03:00" class="w-24 bg-zinc-800 text-center text-xl font-bold py-1 rounded text-white border border-zinc-700">
                </div>
                <div class="flex justify-between items-center">
                    <label class="font-bold text-lg text-zinc-300">Descanso (min:seg)</label>
                    <input type="text" id="inpRest" value="01:00" class="w-24 bg-zinc-800 text-center text-xl font-bold py-1 rounded text-white border border-zinc-700">
                </div>
                <div class="flex justify-between items-center">
                    <label class="font-bold text-lg text-zinc-300">Total de Rounds</label>
                    <input type="number" id="inpRounds" value="3" min="1" max="50" class="w-24 bg-zinc-800 text-center text-xl font-bold py-1 rounded text-white border border-zinc-700">
                </div>
            </div>
        </div>
        <button id="btnCloseSettings" class="bg-red-600 text-white font-bebas text-3xl px-12 py-3 rounded-xl shadow-lg">GUARDAR Y CERRAR</button>
    </div>

    <!-- MODAL RULETAS -->
    <div id="rouletteModal" class="hidden absolute inset-0 z-[70] bg-zinc-950/95 backdrop-blur-sm flex flex-col p-4 items-center pt-20">
        <!-- Pestañas -->
        <div class="flex bg-zinc-900 rounded-full p-1 mb-4">
            <button id="tabSparring" class="px-6 py-2 rounded-full font-bold text-white bg-blue-600 transition-colors">SPARRING</button>
            <button id="tabPenitencia" class="px-6 py-2 rounded-full font-bold text-zinc-400 transition-colors">PENITENCIA</button>
        </div>

        <!-- Ruleta Visual -->
        <div class="relative w-72 h-72 mb-6">
            <canvas id="rouletteCanvas" width="288" height="288" class="w-full h-full rounded-full shadow-2xl border-4 border-zinc-800"></canvas>
            <div class="absolute top-0 left-1/2 -translate-x-1/2 -mt-2 w-0 h-0 border-l-[15px] border-r-[15px] border-t-[25px] border-l-transparent border-r-transparent border-t-white z-10 drop-shadow-md"></div>
            <button id="btnSpin" class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-16 h-16 bg-zinc-900 text-white rounded-full font-bebas text-2xl border-2 border-zinc-700 shadow-lg z-10">GIRAR</button>
        </div>

        <!-- Resultado -->
        <div id="rouletteResult" class="font-bebas text-4xl text-center min-h-[40px] text-white mb-4 drop-shadow-md"></div>

        <!-- Gestión de Lista -->
        <div class="w-full max-w-sm bg-zinc-900 rounded-xl p-4 flex flex-col gap-2">
            <div class="flex gap-2">
                <input type="text" id="inpRouletteItem" placeholder="Añadir opción..." class="flex-1 bg-zinc-800 rounded px-3 text-white border border-zinc-700">
                <button id="btnAddItem" class="bg-zinc-700 px-4 py-2 rounded font-bold hover:bg-zinc-600">+</button>
            </div>
            <div id="rouletteList" class="max-h-32 overflow-y-auto mt-2 space-y-1"></div>
        </div>

        <button id="btnCloseRoulette" class="mt-auto mb-4 bg-zinc-800 text-white font-bebas text-2xl px-8 py-2 rounded-xl">VOLVER</button>
    </div>

    <script>
        // --- AUDIOS ---
        const bell = document.getElementById('bellSound');
        const whistle = document.getElementById('whistleSound');
        let audioInitialized = false;

        // --- ESTADO DEL TIMER ---
        const states = { PREP: 'prep', WORK: 'work', REST: 'rest', DONE: 'done', PAUSED: 'paused' };
        let currentState = states.DONE;
        let config = { work: 180, rest: 60, rounds: 3 };
        let timeLeft = 0;
        let currentRound = 1;
        let timerInterval = null;
        let endTime = 0;
        let thirtySecPlayed = false;

        // --- ELEMENTOS UI ---
        const ui = {
            time: document.getElementById('timeDisplay'),
            status: document.getElementById('statusText'),
            round: document.getElementById('currentRoundDisplay'),
            total: document.getElementById('totalRoundsDisplay'),
            ring: document.getElementById('progressRing'),
            btnStart: document.getElementById('btnStart'),
            overlay: document.getElementById('screenOverlay'),
            tView: document.getElementById('trafficLightView'),
            tTime: document.getElementById('trafficTime'),
            tStatus: document.getElementById('trafficStatus'),
            tRound: document.getElementById('trafficRound')
        };

        const RING_CIRCUMFERENCE = 848;

        // --- LÓGICA DEL TIMER ---
        function formatTime(sec) {
            let m = Math.floor(sec / 60).toString().padStart(2, '0');
            let s = (sec % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        }

        function parseTime(str) {
            let pts = str.split(':');
            return (parseInt(pts[0]) * 60) + parseInt(pts[1]);
        }

        function playSound(audioEl) {
            if(!audioInitialized) return;
            audioEl.currentTime = 0;
            audioEl.play().catch(e => console.log("Audio no pudo reproducirse", e));
        }

        function triggerFlash() {
            ui.overlay.classList.remove('flash-warning');
            void ui.overlay.offsetWidth; // Restart anim
            ui.overlay.classList.add('flash-warning');
        }

        function updateUI() {
            const timeStr = formatTime(timeLeft);
            ui.time.innerText = timeStr;
            ui.tTime.innerText = timeStr;
            ui.round.innerText = currentRound;
            ui.tRound.innerText = currentRound;
            ui.total.innerText = config.rounds;
            document.getElementById('trafficTotal').innerText = config.rounds;

            let maxTime = (currentState === states.WORK) ? config.work : (currentState === states.REST ? config.rest : 5);
            let progress = 1 - (timeLeft / maxTime);
            ui.ring.style.strokeDashoffset = RING_CIRCUMFERENCE * progress;

            // Semáforo y Colores
            if (currentState === states.WORK) {
                ui.status.innerText = "PELEAR";
                ui.status.style.color = "#ef4444";
                ui.ring.style.stroke = "#ef4444";
                if(timeLeft <= 30) {
                    ui.tView.className = "absolute inset-0 z-50 flex flex-col items-center justify-center cursor-pointer transition-colors duration-200 bg-yellow-500 text-black";
                    ui.tStatus.innerText = "ÚLTIMOS 30s";
                } else {
                    ui.tView.className = "absolute inset-0 z-50 flex flex-col items-center justify-center cursor-pointer transition-colors duration-200 bg-green-600 text-white";
                    ui.tStatus.innerText = "PELEAR";
                }
            } else if (currentState === states.REST) {
                ui.status.innerText = "DESCANSO";
                ui.status.style.color = "#3b82f6";
                ui.ring.style.stroke = "#3b82f6";
                ui.tView.className = "absolute inset-0 z-50 flex flex-col items-center justify-center cursor-pointer transition-colors duration-200 bg-red-600 text-white";
                ui.tStatus.innerText = "DESCANSO";
            } else if (currentState === states.PREP) {
                ui.status.innerText = "PREPÁRATE";
                ui.status.style.color = "#eab308";
                ui.ring.style.stroke = "#eab308";
                ui.tView.className = "absolute inset-0 z-50 flex flex-col items-center justify-center cursor-pointer transition-colors duration-200 bg-zinc-800 text-yellow-500";
                ui.tStatus.innerText = "PREPÁRATE";
            } else {
                ui.status.innerText = "FINALIZADO";
                ui.status.style.color = "#a1a1aa";
                ui.tView.className = "absolute inset-0 z-50 flex flex-col items-center justify-center cursor-pointer transition-colors duration-200 bg-zinc-900 text-zinc-500";
                ui.tStatus.innerText = "FIN";
            }
        }

        function switchState(newState) {
            currentState = newState;
            thirtySecPlayed = false;
            
            if (newState === states.WORK) {
                timeLeft = config.work;
                playSound(bell);
                triggerFlash();
            } else if (newState === states.REST) {
                timeLeft = config.rest;
                playSound(bell);
                triggerFlash();
            } else if (newState === states.PREP) {
                timeLeft = 5;
            }
            
            endTime = Date.now() + (timeLeft * 1000);
            updateUI();
        }

        function tick() {
            let now = Date.now();
            timeLeft = Math.max(0, Math.ceil((endTime - now) / 1000));

            // Alerta 30s
            if (currentState === states.WORK && timeLeft === 30 && !thirtySecPlayed) {
                playSound(whistle);
                triggerFlash();
                thirtySecPlayed = true;
            }

            if (timeLeft <= 0) {
                if (currentState === states.PREP) {
                    switchState(states.WORK);
                } else if (currentState === states.WORK) {
                    if (currentRound < config.rounds) {
                        switchState(states.REST);
                    } else {
                        currentState = states.DONE;
                        clearInterval(timerInterval);
                        playSound(bell);
                        setTimeout(()=>playSound(bell), 600);
                        ui.btnStart.innerText = "INICIAR";
                        ui.btnStart.classList.replace('bg-yellow-600', 'bg-red-600');
                    }
                } else if (currentState === states.REST) {
                    currentRound++;
                    switchState(states.WORK);
                }
            }
            updateUI();
        }

        function toggleTimer() {
            if(!audioInitialized) {
                bell.load();
                whistle.load();
                audioInitialized = true;
            }

            if (currentState === states.DONE) {
                currentRound = 1;
                switchState(states.PREP);
                timerInterval = setInterval(tick, 100);
                ui.btnStart.innerText = "PAUSAR";
                ui.btnStart.classList.replace('bg-red-600', 'bg-yellow-600');
            } else if (currentState === states.PAUSED) {
                endTime = Date.now() + (timeLeft * 1000);
                timerInterval = setInterval(tick, 100);
                // Restaurar estado visual correcto
                if(ui.status.innerText === "PAUSADO") {
                    currentState = ui.ring.style.stroke === "rgb(239, 68, 68)" ? states.WORK : states.REST;
                }
                ui.btnStart.innerText = "PAUSAR";
                ui.btnStart.classList.replace('bg-red-600', 'bg-yellow-600');
            } else {
                clearInterval(timerInterval);
                currentState = states.PAUSED;
                ui.status.innerText = "PAUSADO";
                ui.status.style.color = "#a1a1aa";
                ui.tStatus.innerText = "PAUSADO";
                ui.btnStart.innerText = "REANUDAR";
                ui.btnStart.classList.replace('bg-yellow-600', 'bg-red-600');
            }
        }

        ui.btnStart.addEventListener('click', toggleTimer);
        ui.tView.addEventListener('click', toggleTimer); // Tap en semáforo para pausar/iniciar

        document.getElementById('btnReset').addEventListener('click', () => {
            clearInterval(timerInterval);
            currentState = states.DONE;
            timeLeft = config.work;
            currentRound = 1;
            ui.btnStart.innerText = "INICIAR";
            ui.btnStart.classList.replace('bg-yellow-600', 'bg-red-600');
            updateUI();
        });


        // --- NAVEGACIÓN Y MODALES ---
        const navBtns = {
            timer: document.getElementById('navTimer'),
            traffic: document.getElementById('navTraffic'),
            roulette: document.getElementById('navRoulette'),
            settings: document.getElementById('navSettings')
        };

        function resetNav() {
            Object.values(navBtns).forEach(b => {
                b.classList.remove('text-red-500');
                b.classList.add('text-zinc-500');
            });
        }

        navBtns.timer.addEventListener('click', () => {
            resetNav(); navBtns.timer.classList.add('text-red-500');
            ui.tView.classList.add('hidden');
        });

        navBtns.traffic.addEventListener('click', () => {
            resetNav(); navBtns.traffic.classList.add('text-red-500');
            ui.tView.classList.remove('hidden');
        });

        navBtns.settings.addEventListener('click', () => {
            document.getElementById('settingsModal').classList.remove('hidden');
        });

        navBtns.roulette.addEventListener('click', () => {
            document.getElementById('rouletteModal').classList.remove('hidden');
            drawRoulette();
        });

        document.getElementById('btnCloseSettings').addEventListener('click', () => {
            config.work = parseTime(document.getElementById('inpWork').value);
            config.rest = parseTime(document.getElementById('inpRest').value);
            config.rounds = parseInt(document.getElementById('inpRounds').value);
            document.getElementById('settingsModal').classList.add('hidden');
            document.getElementById('btnReset').click();
        });

        document.getElementById('btnCloseRoulette').addEventListener('click', () => {
            document.getElementById('rouletteModal').classList.add('hidden');
        });

        // Presets
        document.querySelectorAll('.preset-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.getElementById('inpWork').value = formatTime(e.target.dataset.w);
                document.getElementById('inpRest').value = formatTime(e.target.dataset.r);
                document.getElementById('inpRounds').value = e.target.dataset.rd;
            });
        });


        // --- RULETAS LÓGICA ---
        const defSparring = ["Solo Jab", "Combinación 1-2", "Pelea en Corto", "Solo Defensa", "Sombra Ligera"];
        const defPenitencia = ["20 Burpees", "1 Min Plancha", "30 Flexiones", "Correr Escaleras", "50 Sentadillas"];
        
        let rSparring = JSON.parse(localStorage.getItem('boxfit_sparring')) || defSparring;
        let rPenitencia = JSON.parse(localStorage.getItem('boxfit_penitencia')) || defPenitencia;
        let currentMode = 'sparring'; // 'sparring' o 'penitencia'
        
        const canvas = document.getElementById('rouletteCanvas');
        const ctx = canvas.getContext('2d');
        const rColorsSparring = ["#3b82f6", "#10b981", "#f59e0b", "#8b5cf6", "#ef4444", "#06b6d4"];
        const rColorsPenitencia = ["#fde047", "#f59e0b", "#ea580c", "#dc2626", "#991b1b"];

        let currentAngle = 0;
        let isSpinning = false;
        let spinVelocity = 0;

        function getActiveList() { return currentMode === 'sparring' ? rSparring : rPenitencia; }
        function getActiveColors() { return currentMode === 'sparring' ? rColorsSparring : rColorsPenitencia; }

        function renderList() {
            const listEl = document.getElementById('rouletteList');
            listEl.innerHTML = '';
            getActiveList().forEach((item, index) => {
                const div = document.createElement('div');
                div.className = "flex justify-between items-center bg-zinc-800 p-2 rounded";
                div.innerHTML = `
                    <span class="text-sm font-bold text-white">${item}</span>
                    <button class="text-red-500 font-bold px-2 hover:bg-zinc-700 rounded" onclick="removeItem(${index})">X</button>
                `;
                listEl.appendChild(div);
            });
        }

        window.removeItem = function(index) {
            getActiveList().splice(index, 1);
            saveRoulettes();
            renderList();
            drawRoulette();
        }

        document.getElementById('btnAddItem').addEventListener('click', () => {
            const inp = document.getElementById('inpRouletteItem');
            if(inp.value.trim() !== '') {
                getActiveList().push(inp.value.trim());
                inp.value = '';
                saveRoulettes();
                renderList();
                drawRoulette();
            }
        });

        function saveRoulettes() {
            localStorage.setItem('boxfit_sparring', JSON.stringify(rSparring));
            localStorage.setItem('boxfit_penitencia', JSON.stringify(rPenitencia));
        }

        function drawRoulette() {
            const items = getActiveList();
            const colors = getActiveColors();
            const arc = Math.PI * 2 / items.length;
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            if(items.length === 0) return;

            for(let i = 0; i < items.length; i++) {
                const angle = currentAngle + i * arc;
                ctx.beginPath();
                ctx.fillStyle = colors[i % colors.length];
                ctx.moveTo(144, 144);
                ctx.arc(144, 144, 140, angle, angle + arc);
                ctx.fill();
                ctx.save();
                
                // Texto
                ctx.translate(144 + Math.cos(angle + arc / 2) * 80, 144 + Math.sin(angle + arc / 2) * 80);
                ctx.rotate(angle + arc / 2);
                ctx.fillStyle = "#fff";
                ctx.font = "bold 16px 'Barlow Condensed'";
                ctx.textAlign = "center";
                // Truncar texto largo
                let text = items[i];
                if(text.length > 15) text = text.substring(0,13)+"...";
                ctx.fillText(text, 0, 5);
                ctx.restore();
            }
        }

        function spinRoulette() {
            if(isSpinning || getActiveList().length === 0) return;
            isSpinning = true;
            document.getElementById('rouletteResult').innerText = "";
            spinVelocity = Math.random() * 0.2 + 0.4; 
            
            function animate() {
                currentAngle += spinVelocity;
                spinVelocity *= 0.985; // Fricción
                drawRoulette();
                
                if(spinVelocity > 0.002) {
                    requestAnimationFrame(animate);
                } else {
                    isSpinning = false;
                    // Calcular ganador (la flecha está arriba, apuntando a -PI/2)
                    const items = getActiveList();
                    const arc = Math.PI * 2 / items.length;
                    // Normalizar angulo de la flecha relativo a la ruleta
                    const normalizedAngle = (Math.PI * 1.5 - currentAngle) % (Math.PI * 2);
                    const finalAngle = normalizedAngle < 0 ? normalizedAngle + Math.PI * 2 : normalizedAngle;
                    const winningIndex = Math.floor(finalAngle / arc);
                    
                    document.getElementById('rouletteResult').innerText = "🔥 " + items[winningIndex].toUpperCase() + " 🔥";
                    if(audioInitialized) playSound(bell);
                }
            }
            animate();
        }

        document.getElementById('btnSpin').addEventListener('click', spinRoulette);

        // Pestañas Ruleta
        const tSparring = document.getElementById('tabSparring');
        const tPenitencia = document.getElementById('tabPenitencia');

        tSparring.addEventListener('click', () => {
            currentMode = 'sparring';
            tSparring.classList.replace('text-zinc-400', 'text-white');
            tSparring.classList.add('bg-blue-600');
            tPenitencia.classList.replace('text-white', 'text-zinc-400');
            tPenitencia.classList.remove('bg-red-600');
            renderList(); drawRoulette();
        });

        tPenitencia.addEventListener('click', () => {
            currentMode = 'penitencia';
            tPenitencia.classList.replace('text-zinc-400', 'text-white');
            tPenitencia.classList.add('bg-red-600');
            tSparring.classList.replace('text-white', 'text-zinc-400');
            tSparring.classList.remove('bg-blue-600');
            renderList(); drawRoulette();
        });

        // Inicializar UI
        updateUI();

    </script>
</body>
</html>
