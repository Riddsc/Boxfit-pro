name: Generar APK de Boxfit Pro

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
    - name: 1. Descargar el código
      uses: actions/checkout@v4

    - name: 2. Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: 3. Configurar Java 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: 4. Preparar proyecto y Capacitor
      run: |
        mkdir -p www/fonts
        cp index.html www/
        npm init -y
        npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/app @capacitor/haptics @capacitor/filesystem @capacitor/share @fontsource/bebas-neue @fontsource/barlow-condensed
        # Fuentes dentro del APK (la app funciona sin internet)
        cp node_modules/@fontsource/bebas-neue/files/bebas-neue-latin-400-normal.woff2 www/fonts/
        for w in 400 600 700; do cp node_modules/@fontsource/barlow-condensed/files/barlow-condensed-latin-$w-normal.woff2 www/fonts/; done
        ls -la www/fonts
        npx cap init "Boxfit Pro" "com.riddsc.boxfitpro" --web-dir www
        npx cap add android
        # Código nativo propio: pantalla encendida durante el timer
        JAVA_DIR=android/app/src/main/java/com/riddsc/boxfitpro
        cp native/MainActivity.java native/KeepAwakePlugin.java $JAVA_DIR/
        npx cap sync android
        # Versión 3.2
        sed -i 's/versionCode 1$/versionCode 32/; s/versionName "1.0"/versionName "3.2"/' android/app/build.gradle
        grep -n "version" android/app/build.gradle

    - name: 5. Ícono nuevo (guante + anillo de timer, ícono adaptativo)
      run: |
        mkdir -p assets
        cp icon/icon.png assets/icon-only.png
        cp icon/icon-foreground.png assets/icon-foreground.png
        cp icon/icon-background.png assets/icon-background.png
        cp icon/splash.png assets/splash.png
        cp icon/splash-dark.png assets/splash-dark.png
        npm install -D @capacitor/assets
        npx @capacitor/assets generate --android --iconBackgroundColor '#120608' --iconBackgroundColorDark '#120608' --splashBackgroundColor '#09090c' --splashBackgroundColorDark '#09090c'
        ls android/app/src/main/res/mipmap-xxxhdpi/

    - name: 6. Parchear conflicto de Kotlin (Duplicados)
      run: |
        cat <<EOF >> android/app/build.gradle
        
        configurations.all {
            resolutionStrategy {
                exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk7"
                exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk8"
            }
        }
        EOF

    - name: 7. Compilar el APK (Android Studio)
      working-directory: ./android
      run: |
        # Firma fija y explícita: todas las versiones usan la misma llave del repo
        mkdir -p ~/.android && cp ../keystore/boxfit.keystore ~/.android/debug.keystore
        cp ../keystore/boxfit.keystore app/boxfit.keystore
        cat <<'EOF2' >> app/build.gradle

        android {
            signingConfigs {
                boxfit {
                    storeFile file('boxfit.keystore')
                    storePassword 'android'
                    keyAlias 'androiddebugkey'
                    keyPassword 'android'
                }
            }
            buildTypes {
                debug { signingConfig signingConfigs.boxfit }
                release { signingConfig signingConfigs.boxfit }
            }
        }
        EOF2
        chmod +x gradlew
        ./gradlew assembleDebug --stacktrace

    - name: 8. Renombrar el archivo APK y mostrar su firma
      run: |
        mv android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/BoxfitPro.apk
        FP=$(keytool -printcert -jarfile android/app/build/outputs/apk/debug/BoxfitPro.apk | grep "SHA256:" | head -1)
        echo "::notice title=Firma del APK::$FP"

    - name: 9. Subir el APK listo
      uses: actions/upload-artifact@v4
      with:
        name: BoxfitPro-Instalador
        path: android/app/build/outputs/apk/debug/BoxfitPro.apk
