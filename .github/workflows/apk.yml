name: Generar APK de Boxfit Pro

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
    - name: 1. Descargar el código
      uses: actions/checkout@v4

    - name: 2. Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: 3. Configurar Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: 4. Preparar proyecto y Capacitor
      run: |
        mkdir -p www
        cp index.html www/
        npm init -y
        npm install @capacitor/core @capacitor/cli @capacitor/android
        npx cap init "Boxfit Pro" "com.riddsc.boxfitpro" --web-dir www
        npx cap add android
        npx cap sync android

    - name: 5. Compilar el APK (Android Studio)
      working-directory: ./android
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug --stacktrace

    - name: 6. Renombrar el archivo APK
      run: mv android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/BoxfitPro.apk

    - name: 7. Subir el APK listo
      uses: actions/upload-artifact@v4
      with:
        name: BoxfitPro-Instalador
        path: android/app/build/outputs/apk/debug/BoxfitPro.apk
