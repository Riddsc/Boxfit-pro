name: Generar APK de Satronho BoxFit

on:
  push:
    branches: [ "main", "master", "satronho-*" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
    - name: 1. Descargar el código
      uses: actions/checkout@v4

    - name: 2. Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: 3. Configurar Java 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: 4. Preparar proyecto y Capacitor
      run: |
        mkdir -p www/fonts
        cp index.html www/
        cp -r js css www/
        npm init -y
        # Capacitor 7 (la misma versión con la que compila Satronho Somnia y su Health Connect)
        npm install @capacitor/core@^7 @capacitor/cli@^7 @capacitor/android@^7 @capacitor/app@^7 @capacitor/haptics@^7 @capacitor/filesystem@^7 @capacitor/share@^7 @capacitor/local-notifications@^7 @capacitor/status-bar@^7 @kiwi-health/capacitor-health-connect@^0.0.43 @fontsource/bebas-neue @fontsource/barlow-condensed
        # Fuentes dentro del APK (la app funciona sin internet)
        cp node_modules/@fontsource/bebas-neue/files/bebas-neue-latin-400-normal.woff2 www/fonts/
        for w in 400 600 700; do cp node_modules/@fontsource/barlow-condensed/files/barlow-condensed-latin-$w-normal.woff2 www/fonts/; done
        ls -la www/fonts
        npx cap init "Satronho BoxFit" "com.riddsc.boxfitpro" --web-dir www
        npx cap add android
        # Código nativo propio: pantalla encendida durante el timer y contador de pasos
        JAVA_DIR=android/app/src/main/java/com/riddsc/boxfitpro
        cp native/MainActivity.java native/KeepAwakePlugin.java native/StepsPlugin.java native/StepStore.java native/StepAlarm.java native/WidgetPlugin.java native/BoxFitWidget.java $JAVA_DIR/
        # Widget de la pantalla de inicio (diseño, fondos y barras)
        cp -r native/res/* android/app/src/main/res/
        # Permisos (pasos, recordatorios) y el enlace satronhoboxfit:// para el cruce con Satronho Somnia
        python3 scripts/patch-manifest.py android/app/src/main/AndroidManifest.xml
        npx cap sync android
        # Versión 4.3.2 (mismo paquete: se instala encima de Boxfit Pro sin perder los datos)
        sed -i 's/versionCode 1$/versionCode 45/; s/versionName "1.0"/versionName "4.3.2"/' android/app/build.gradle
        # Health Connect pide Android 8+ y compilar con Android 16 (API 36) y el plugin de Gradle 8.9.1, como en Somnia
        sed -i -E 's/minSdkVersion = [0-9]+/minSdkVersion = 26/; s/compileSdkVersion = [0-9]+/compileSdkVersion = 36/' android/variables.gradle
        sed -i -E 's/com\.android\.tools\.build:gradle:[0-9.]+/com.android.tools.build:gradle:8.9.1/' android/build.gradle
        cat android/variables.gradle
        grep -n "version" android/app/build.gradle

    - name: 5. Ícono Satronho (planeta BoxFit con los guías en órbita, ícono adaptativo)
      run: |
        mkdir -p assets
        cp icon/icon.png assets/icon-only.png
        cp icon/icon-foreground.png assets/icon-foreground.png
        cp icon/icon-background.png assets/icon-background.png
        cp icon/splash.png assets/splash.png
        cp icon/splash-dark.png assets/splash-dark.png
        npm install -D @capacitor/assets
        npx @capacitor/assets generate --android --iconBackgroundColor '#0f0d17' --iconBackgroundColorDark '#0f0d17' --splashBackgroundColor '#120d14' --splashBackgroundColorDark '#120d14'
        ls android/app/src/main/res/mipmap-xxxhdpi/

    - name: 6. Parchear conflicto de Kotlin (Duplicados)
      run: |
        cat <<EOF >> android/app/build.gradle
        
        configurations.all {
            resolutionStrategy {
                exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk7"
                exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk8"
            }
        }
        EOF

    - name: 7. Compilar el APK (Android Studio)
      working-directory: ./android
      run: |
        # Firma fija y explícita: todas las versiones usan la misma llave del repo
        mkdir -p ~/.android && cp ../keystore/boxfit.keystore ~/.android/debug.keystore
        cp ../keystore/boxfit.keystore app/boxfit.keystore
        cat <<'EOF2' >> app/build.gradle

        android {
            signingConfigs {
                boxfit {
                    storeFile file('boxfit.keystore')
                    storePassword 'android'
                    keyAlias 'androiddebugkey'
                    keyPassword 'android'
                }
            }
            buildTypes {
                debug { signingConfig signingConfigs.boxfit }
                release { signingConfig signingConfigs.boxfit }
            }
        }
        EOF2
        chmod +x gradlew
        ./gradlew assembleDebug --stacktrace

    - name: 8. Renombrar el archivo APK y mostrar su firma
      run: |
        mv android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/Satronho-BoxFit.apk
        FP=$(keytool -printcert -jarfile android/app/build/outputs/apk/debug/Satronho-BoxFit.apk | grep "SHA256:" | head -1)
        echo "::notice title=Firma del APK::$FP"

    - name: 9. Subir el APK listo
      uses: actions/upload-artifact@v4
      with:
        name: Satronho-BoxFit-Instalador
        path: android/app/build/outputs/apk/debug/Satronho-BoxFit.apk
